# cl-json-kit documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
# The Nix flake (`nix build .#docs`) drives the same config offline.

site_name: cl-json-kit
site_description: >-
  Dependency-free JSON reader and writer for Common Lisp — explicit
  object/array mappings, opaque null/false sentinels, bounded resource use,
  and structured diagnostics.
site_author: cl-json-kit contributors
site_url: https://nerima-lisp.github.io/cl-json-kit/

repo_name: nerima-lisp/cl-json-kit
repo_url: https://github.com/nerima-lisp/cl-json-kit
edit_uri: edit/main/docs/src/

# Content lives in docs/src; the rendered site is written to docs/../site.
docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; cl-json-kit contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/code-json
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-json-kit
      name: cl-json-kit on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. Nix vs. ASDF install paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols, emoji.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: README.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
  - Guide:
      - Data Model and Mapping: data-model.md
      - Reading JSON: reading.md
      - Writing JSON: writing.md
      - Conversion Helpers: conversion.md
      - Error Handling: error-handling.md
      - Resource Limits and Security: security.md
      - Recipes: recipes.md
      - FAQ: faq.md
  - Reference:
      - API Reference: api-reference.md
      - RFC 8259 Scope: rfc-8259.md
  - Benchmarks: benchmarks.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
